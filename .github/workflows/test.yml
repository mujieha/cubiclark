name: test

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The Mac runs this repository's own branches while the repository is private, and never once it is
    # public: this condition is then false for every run, a fork's pull request included (R2-1, R3-1).
    # A fork can edit this file, so the runner itself must also leave the repository at the public switch.
    if: github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: ''
          package-manager-cache: false

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:hooks
      - run: npx playwright install chromium
      - run: npm run test:e2e

  hosted:
    # Pull requests from forks, and every run once the repository is public, run on a GitHub-hosted
    # Linux runner instead, without the pixel comparisons (their baselines are macOS and Chromium; run
    # `npm run test:e2e` on a Mac before merging).
    if: github.event.repository.private == false || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:hooks
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep-invert @pixels
