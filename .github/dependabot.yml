# Updates are proposed weekly, as one pull request per ecosystem, into develop (R2-8). The actions are
# pinned by SHA, and the dev dependencies by exact version: nothing else would propose their updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    # typescript waits for typescript-eslint to accept 7.x; @types/node follows the Node line the
    # package targets (engines >=22, CI on 22), so neither takes a major bump on its own.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        patterns: ['*']
